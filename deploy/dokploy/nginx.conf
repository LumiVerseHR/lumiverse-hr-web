# Container nginx for the static site. Terminates plain HTTP on :80 —
# Traefik (Dokploy) handles TLS, HTTP->HTTPS and the apex->www redirect,
# so this only serves the canonical www content.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  # No `index` directive on purpose: it would internally rewrite `/` to
  # `/index.html`, which the redirect below turns into a 308 loop. The root
  # is served explicitly instead.

  # Traefik terminates TLS and forwards plain HTTP to us, so nginx would build
  # its 3xx Location headers with scheme "http" — the .html -> clean-URL 308
  # below then bounces an HTTPS visitor through http:// and back. Emitting a
  # relative Location instead keeps the redirect on whatever scheme the client
  # actually used.
  absolute_redirect off;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Home page.
  location = / {
    try_files /index.html =404;
  }

  # Canonical, extensionless URLs (/rentalica, not /rentalica.html).
  # Exact match for index wins over the regex below and avoids /index -> loop.
  location = /index.html {
    return 308 /;
  }
  location ~ ^/(.+)\.html$ {
    return 308 /$1$is_args$args;
  }

  # Styled 404, served internally with the 404 status preserved. The exact
  # match wins over the .html regex, so the error page doesn't get redirected.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  location ~* \.(?:css|js|mjs)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpe?g|gif|webp|svg|ico|pdf)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Extensionless pages: /rentalica -> rentalica.html
  location / {
    try_files $uri $uri.html =404;
  }
}
