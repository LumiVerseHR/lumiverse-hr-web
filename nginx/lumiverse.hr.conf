server {
  listen 80;
  listen [::]:80;
  server_name lumiverse.hr www.lumiverse.hr;

  return 308 https://www.lumiverse.hr$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name lumiverse.hr;

  return 308 https://www.lumiverse.hr$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.lumiverse.hr;

  root /var/www/lumiverse.hr/current;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /index.html {
    return 308 /;
  }

  location ~ ^/(.+)\.html$ {
    return 308 /$1$is_args$args;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location ~* \.(?:css|js|mjs)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpe?g|gif|webp|svg|ico|pdf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  error_page 404 /404.html;
}
